const spk=t=>`<button class="ic" onclick="say(this.dataset.t)" data-t="${t.replace(/"/g,'&quot;')}" aria-label="Play sound">🔊</button>`;
const V={};
V.home=()=>{T('English Shikkha');A(`<div class="hero"><h2>Learn English, step by step</h2><p>Words, speaking and IELTS practice with Bangla help. Ask the AI helper any time.</p></div><div class="grid">${card('🗣','Speaking','Talk with AI, repeat, role play',"go('speak')")}${card('📘','Grammar','Rules with Bangla examples',"go('gram')")}${card('🎯','IELTS','Reading, listening, writing',"go('ielts')")}${card('✏','Practice','Quick AI quiz',"go('quiz')")}${card('🔤','Vocabulary A-Z','Words, Bangla, sound, sentences',"go('vocab')")}</div>`)};
let FULL=null,PG=0,Q='';
const BN=()=>({...Object.fromEntries(ALL().map(x=>[x.w.toLowerCase(),x.bn])),...L('bn',{})});
async function loadFull(){if(FULL)return;try{const r=await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');if(!r.ok)throw 0;FULL=(await r.text()).split(/\r?\n/).map(s=>s.trim()).filter(s=>s.length>1)}catch(e){FULL=ALL().map(x=>x.w.toLowerCase());toast('Could not load the full word list. Showing sample words. Check your internet.')}}
V.vocab=()=>{T('Vocabulary A-Z');if(!FULL){A('<p class="sub">Loading all English words...</p>');loadFull().then(()=>{if(stack[stack.length-1][0]=='vocab')render()});return}
const q=Q.toLowerCase(),base=q?FULL.filter(w=>w.startsWith(q)):FULL.filter(w=>w[0]==LT.toLowerCase());window.VL={base,i:0,bn:BN()};
A(`<input id="qs" placeholder="Search a word, then press Enter" value="${Q}" onkeydown="if(event.key=='Enter'){Q=this.value.trim().replace(/[^a-zA-Z]/g,'');if(Q)LT=Q[0].toUpperCase();render()}"><div class="bar" style="position:sticky;top:66px;z-index:4;background:var(--paper);padding:6px 0;overflow-x:auto;flex-wrap:nowrap">${[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>`<button class="chip ${c==LT?'on':''}" onclick="LT='${c}';Q='';render()">${c}</button>`).join('')}</div><p class="sub" style="margin:4px 0">${LT}: ${base.length} words</p>${FULL.length<200?`<div class="box" style="background:#fff4dc;border-color:var(--sun)">Only sample words are loaded here, because this preview blocks internet. Download the file and open it in your own browser to load the full English word list.</div>`:''}<button class="btn y" style="margin:4px 0 12px" onclick="moreWords(this)">Add 20 new words for ${LT} with AI</button><div id="wl"></div><div id="sen" class="sub" style="text-align:center">${base.length?'':'No word found.'}</div>${!base.length&&Q?`<button class="btn y" onclick="go('word','${Q.toLowerCase()}')">Look up "${Q}" with AI</button>`:''}`);
moreW();new IntersectionObserver(e=>{if(e[0].isIntersecting)moreW()},{rootMargin:'1200px'}).observe($('#sen'))};
async function moreWords(b){await safe(async()=>{const have=ALL().filter(x=>x.w[0].toUpperCase()==LT).map(x=>x.w).join(',');const r=await jk(`Give 20 useful English words starting with the letter ${LT} for IELTS and daily English that are not in this list: ${have}. Return JSON array [{"w":"","bn":"Bangla meaning"}]`);S('xw',[...L('xw',[]),...r]);FULL=null;render()},b)}
function moreW(){const{base,bn}=VL,end=Math.min(base.length,VL.i+150);let h='';for(;VL.i<end;VL.i++){const w=base[VL.i];h+=`<div class="row" onclick="go('word','${w}')"><span class="n">${VL.i+1}</span><div class="w"><b>${w}</b><small>${bn[w]||'Tap to see Bangla meaning'}</small></div><button class="ic" onclick="event.stopPropagation();say('${w}')" aria-label="Play sound">🔊</button></div>`}const el=$('#wl');if(el)el.insertAdjacentHTML('beforeend',h)}
V.word=w=>{T(w);cur=w;const k=w.toLowerCase(),bn=BN()[k],e=L('ex_'+w,{s:[],d:[]});
if(!bn)safe(async()=>{const r=await jk(`Give the Bangla meaning of the English word "${w}". Return JSON {"bn":"Bangla meaning"}`);S('bn',{...L('bn',{}),[k]:r.bn});if(cur==w)render()});
A(`<div class="row"><div class="w"><b style="font-size:22px">${w}</b><small>${bn||'Loading meaning...'}</small></div>${spk(w)}</div><div class="tabs"><button class="${TB=='s'?'on':''}" onclick="TB='s';render()">Sentences</button><button class="${TB=='d'?'on':''}" onclick="TB='d';render()">Dialogues</button></div>${(TB=='s'?e.s.map(s=>`<div class="row"><div class="w">${s.en}<small>${s.bn}</small></div>${spk(s.en)}</div>`):e.d.map(d=>`<div class="box">${d.lines.map(l=>`<div><b>${l[0]}:</b> ${l[1]}</div>`).join('')}<small style="color:var(--mut)">${d.bn}</small><br><button class="btn s" onclick="say(${JSON.stringify(d.lines.map(l=>l[1]).join(' ')).replace(/"/g,'&quot;')})">🔊 Play</button></div>`)).join('')||'<p class="sub">Nothing here yet. Tap the button below to create one.</p>'}<button class="btn y" onclick="addEx(this)">${TB=='s'?'Add new sentence':'Add new dialogue'}</button>`)};
async function addEx(b){await safe(async()=>{const e=L('ex_'+cur,{s:[],d:[]});if(TB=='s'){e.s.unshift(await jk(`Write 1 new natural English sentence using the word "${cur}". Return JSON {"en":"","bn":"Bangla translation"}`))}else{e.d.unshift(await jk(`Write a short 4-line dialogue between A and B using the word "${cur}". Return JSON {"lines":[["A","text"],["B","text"]],"bn":"one-line Bangla summary"}`))}S('ex_'+cur,e);render()},b)}
V.gram=()=>{T('Grammar');A(`<p class="sub">Choose a topic. The AI explains it in simple English with Bangla.</p><div class="grid">${['Tenses','Articles (a, an, the)','Prepositions','Modal verbs','Conditionals','Passive voice'].map(t=>card('📘',t,'Tap to learn',`go('gtopic','${t}')`)).join('')}</div>`)};
V.gtopic=t=>{T(t);A(`<div class="box" id="gx">Loading...</div><button class="btn y" onclick="V.gtopic('${t}')">Explain again with new examples</button>`);safe(async()=>{$('#gx').innerHTML=(await ask(`Teach "${t}" to a Bangla-speaking learner preparing for IELTS. Short, clear rules, 4 examples each with Bangla translation. Plain text, no markdown symbols.`)).replace(/\n/g,'<br>')})};
V.quiz=()=>{T('Practice');A(`<p class="sub">Pick a skill for a 5-question AI quiz.</p><div class="grid">${['Vocabulary','Grammar','Prepositions','Tenses'].map(t=>card('✏',t,'5 questions',`go('qz','${t}')`)).join('')}</div>`)};
V.qz=t=>{T(t+' quiz');A('<div id="qx" class="box">Making questions...</div>');safe(async()=>{const q=await jk(`Make 5 multiple choice ${t} questions for an IELTS learner. Return JSON [{"q":"","o":["","","",""],"a":0}] where a is the correct option index.`);let sc=0,n=0;$('#qx').outerHTML=q.map((x,i)=>`<div class="box"><b>${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<div><button class="chip" style="width:100%;text-align:left;margin-top:6px" onclick="this.className='chip on';this.style.background=${j==x.a}?'#1b8a5a':'#c23b3b';this.parentNode.parentNode.querySelectorAll('button').forEach(b=>b.disabled=true)">${o}</button></div>`).join('')}</div>`).join('')})};
V.speak=()=>{T('Speaking');A(`<div class="grid">${card('🤖','AI talk','Voice or sms',"go('talk','free')")}${card('🔁','Repeat after me','Shadowing',"go('rep',0)")}${card('👂','Pronunciation','Hard sounds',"go('rep',1)")}${card('🎭','Role play','Shop, airport, job',"go('roles')")}${card('💬','Daily phrases','With Bangla',"go('phr')")}${card('🎯','IELTS speaking','Part 1, 2, 3',"go('talk','ielts')")}${card('⏺','Record and listen','Hear yourself',"go('recd')")}${card('📈','My progress','Practice count',"go('prog')")}</div>`)};
const SYS=m=>`You are a friendly English speaking coach for a Bangla-speaking learner. ${m.startsWith('role:')?'Play this role-play scenario and stay in character: '+m.slice(5)+'.':m=='ielts'?'Act as an IELTS speaking examiner. Ask one Part 1, 2 or 3 question at a time and give a short band-style comment after answers.':'Chat naturally.'} Keep replies under 60 words. If the learner makes a mistake, start with "Better: ..." giving the corrected sentence, then continue. If they write Bangla, help in Bangla.`;
V.roles=()=>{T('Role play');A(`<div class="grid">${ROLES.map(r=>card('🎭',r,'Start',`go('talk','role:${r}')`)).join('')}</div>`)};
V.talk=m=>{T(m=='ielts'?'IELTS speaking':m=='free'?'AI talk':'Role play');A(`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;height:min(560px,70vh);display:flex;flex-direction:column;overflow:hidden">${chatUI('talk',SYS(m))}</div>`);if(!CH.talk.d.length)snd('talk','Hello! Please start.',1)};
function chatUI(id,sys){if(!CH[id]||CH[id].sys!=sys)CH[id]={h:[],d:[],sys};return`<div class="msgs" id="m-${id}">${mh(id)}</div><div class="pend" id="p-${id}"></div><div class="inp"><div class="am" id="am-${id}"><button onclick="att('fi','${id}')">🖼 Picture</button><button onclick="att('fc','${id}')">📷 Camera</button><button onclick="att('fp','${id}')">📄 PDF</button><button onclick="att('ff','${id}')">📎 File</button></div><button class="ic" onclick="$('#am-${id}').classList.toggle('o')" aria-label="Attach">＋</button><input id="i-${id}" placeholder="Type or tap the mic" onkeydown="if(event.key=='Enter')snd('${id}')"><button class="ic" id="mc-${id}" onclick="mic('${id}')" aria-label="Voice">🎤</button><button class="ic pr" onclick="snd('${id}')" aria-label="Send">➤</button></div>`}
const mh=id=>CH[id].d.map(x=>`<div class="m ${x.r}">${x.t}</div>`).join('');
function att(inp,id){const f=$('#'+inp);f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{pend[id]={inline_data:{mime_type:file.type||'application/octet-stream',data:r.result.split(',')[1]}};$('#p-'+id).textContent='Attached: '+file.name};r.readAsDataURL(file)};$('#am-'+id).classList.remove('o');f.click()}
let rc=null;function mic(id){const b=$('#mc-'+id);if(rc){rc.stop();return}b.textContent='⏹';let t='';rc=listen(x=>{t=x;$('#i-'+id).value=x},()=>{rc=null;b.textContent='🎤';if(t.trim())snd(id)})}
async function snd(id,txt,hide){const i=$('#i-'+id),t=txt||(i&&i.value.trim());const p=pend[id];if(!t&&!p)return;if(i)i.value='';pend[id]=null;$('#p-'+id)&&($('#p-'+id).textContent='');const c=CH[id];c.h.push({role:'user',parts:[{text:t||'Please check this.'},...(p?[p]:[])]});if(!hide)c.d.push({r:'u',t:(p?'📎 ':'')+(t||'')});c.d.push({r:'a',t:'...'});up(id);bump('talk');
try{const r=await ai(c.h,false,c.sys);c.h.push({role:'model',parts:[{text:r}]});c.d[c.d.length-1].t=r.replace(/</g,'&lt;');if(id=='talk')say(r.replace(/Better:/g,''))}catch(e){c.d.pop();c.h.pop();toast(e.message)}up(id)}
function up(id){const m=$('#m-'+id);if(m){m.innerHTML=mh(id);m.scrollTop=1e9}}
V.rep=k=>{const l=k?HARD:PH;T(k?'Pronunciation':'Repeat after me');let i=L('ri',0)%l.length;A(`<div class="box" style="text-align:center"><div style="font-size:22px;font-weight:600" id="rp">${l[i][0]}</div><small style="color:var(--mut)">${l[i][1]}</small><div style="margin-top:12px"><button class="btn s" onclick="say(${JSON.stringify(l[i][0]).replace(/"/g,'&quot;')})">🔊 Listen</button> <button class="btn s" onclick="say(${JSON.stringify(l[i][0]).replace(/"/g,'&quot;')},.55)">🐢 Slow</button></div></div><button class="big" id="rb" onclick="repGo(${k},${i})" aria-label="Speak">🎤</button><div class="box" id="rr" style="text-align:center">Tap the mic and say the sentence.</div><div style="display:flex;justify-content:space-between"><button class="btn s" onclick="S('ri',${(i+l.length-1)%l.length});render()">Previous</button><button class="btn" onclick="S('ri',${(i+1)%l.length});render()">Next</button></div>`)};
function repGo(k,i){if(rc){rc.stop();return}const b=$('#rb');b.classList.add('rec');const ex=(k?HARD:PH)[i][0];let t='';rc=listen(x=>{t=x;const d=diff(ex,x);$('#rr').innerHTML=`${d.html}<br><b>${d.pct}%</b>`},()=>{rc=null;b.classList.remove('rec');if(t){bump('rep');const d=diff(ex,t);$('#rr').innerHTML=`${d.html}<br><b>${d.pct}% correct</b><br><small>${d.pct>=80?'Great job.':'Red words need practice. Listen and try again.'}</small>`}})}
V.phr=()=>{T('Daily phrases');A(PH.map(p=>`<div class="row"><div class="w">${p[0]}<small>${p[1]}</small></div>${spk(p[0])}</div>`).join(''))};
V.recd=()=>{T('Record and listen');A(`<p class="sub">Record yourself, then play it back and compare with the model voice.</p><div class="box"><b id="rt">${PH[0][0]}</b></div><button class="btn s" onclick="say($('#rt').textContent)">🔊 Model voice</button><button class="big" id="rb2" onclick="recAud()" aria-label="Record">⏺</button><audio id="au" controls style="width:100%"></audio>`)};
let mr=null;async function recAud(){const b=$('#rb2');if(mr){mr.stop();return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);const ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());$('#au').src=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));mr=null;b.classList.remove('rec');b.textContent='⏺'};mr.start();b.classList.add('rec');b.textContent='⏹'}catch(e){toast('Microphone permission is needed')}}
V.prog=()=>{T('My progress');const p=L('prog',{});A(`<div class="grid"><div class="card"><b style="font-size:30px">${p.rep||0}</b><span>Repeat attempts</span></div><div class="card"><b style="font-size:30px">${p.talk||0}</b><span>AI messages</span></div><div class="card"><b style="font-size:30px">${L('ps',[]).length}</b><span>Passages you added</span></div></div>`)};
V.ielts=()=>{T('IELTS');A(`<div class="grid">${card('📖','Reading','Passages by topic',"go('topics')")}${card('🎧','Listening','AI audio and questions',"go('lis')")}${card('🎤','Speaking','AI examiner',"go('talk','ielts')")}${card('📝','Writing','AI checks and scores',"go('wri')")}${card('🎯','Practice','Quick quizzes',"go('quiz')")}</div>`)};
V.topics=()=>{T('Reading topics');A(`<div class="grid">${TOP.map(t=>card(t[1],t[0],PS().filter(p=>p.c==t[0]).length+' passages',`go('plist','${t[0]}')`)).join('')}</div><br><button class="btn y" onclick="go('addp')">Add a passage</button>`)};
V.plist=c=>{T(c);const l=PS().filter(p=>p.c==c);A(l.map(p=>`<div class="row" onclick="SEL=null;go('pass',${PS().indexOf(p)})"><div class="w"><b>${p.t}</b></div>›</div>`).join('')+`<p class="sub">${l.length?'':'No passages yet in this topic.'}</p><button class="btn y" onclick="go('addp','${c}')">Add a passage</button>`)};
V.pass=i=>{const p=PS()[i];T(p.t);const s=p.x.split(/(?<=[.!?])\s+/);window.PSN=s;A(`<div class="box" id="px">${s.map((x,j)=>`<span class="sent ${SEL==j?'sel':''}" onclick="SEL=${j};V.pass(${i})">${x}</span>`).join(' ')}</div><div class="bar"><button class="btn s" onclick="SEL==null?toast('Tap a line first'):say(PSN[SEL])">🔊 Listen to line</button><button class="btn s" onclick="say(PSN.join(' '))">🔊 Listen to all</button><button class="btn" id="rd" onclick="readAloud()">🎤 Read aloud and get live help</button><button class="btn s" onclick="tr(this)">Bangla</button><button class="btn y" onclick="qs(this,${i})">AI questions</button></div><div class="box" id="rr" style="display:none"></div><div id="ex"></div>`)};
function readAloud(){if(SEL==null)return toast('Tap a line first');if(rc){rc.stop();return}const ex=PSN[SEL],b=$('#rd');b.textContent='⏹ Stop';$('#rr').style.display='block';rc=listen(x=>{$('#rr').innerHTML=diff(ex,x).html+`<br><b>${diff(ex,x).pct}%</b> <small>Red words were not heard clearly.</small>`},()=>{rc=null;b.textContent='🎤 Read aloud and get live help';bump('rep')})}
async function tr(b){await safe(async()=>{const t=SEL==null?PSN.join(' '):PSN[SEL];$('#ex').innerHTML=`<div class="box">${(await ask('Translate to Bangla only: '+t)).replace(/\n/g,'<br>')}</div>`},b)}
async function qs(b,i){await safe(async()=>{$('#ex').innerHTML=`<div class="box">${(await ask('Write 4 IELTS reading questions (True/False/Not Given and fill in the blank) with answers at the end for this passage. Plain text:\n'+PS()[i].x)).replace(/\n/g,'<br>')}</div>`},b)}
V.addp=c=>{T('Add passage');A(`<input id="at" placeholder="Title"><select id="ac">${TOP.map(t=>`<option ${t[0]==c?'selected':''}>${t[0]}</option>`).join('')}</select><textarea id="ax" placeholder="Paste or type your passage"></textarea><div class="bar"><button class="btn y" onclick="genP(this)">Generate with AI</button><button class="btn" onclick="savP()">Save passage</button></div>`)};
async function genP(b){await safe(async()=>{const r=await jk(`Write an original IELTS-style reading passage (about 150 words) on the topic ${$('#ac').value}${$('#at').value?' titled '+$('#at').value:''}. Return JSON {"t":"title","x":"passage text"}`);$('#at').value=r.t;$('#ax').value=r.x},b)}
function savP(){const t=$('#at').value.trim(),x=$('#ax').value.trim();if(!t||!x)return toast('Enter a title and the passage text');S('ps',[...L('ps',[]),{t,c:$('#ac').value,x}]);toast('Passage saved');back()}
V.lis=()=>{T('Listening');A(`<p class="sub">The AI writes a short talk, reads it aloud, and asks questions.</p><select id="lt">${TOP.map(t=>`<option>${t[0]}</option>`).join('')}</select><button class="btn y" onclick="lisGo(this)">Create listening test</button><div id="lx"></div>`)};
async function lisGo(b){await safe(async()=>{const r=await jk(`Write an original 90-word IELTS-style spoken monologue about ${$('#lt').value} and 3 questions. Return JSON {"s":"script","q":[{"q":"","a":"answer"}]}`);window.LS=r.s;$('#lx').innerHTML=`<div class="box"><button class="btn" onclick="say(LS,.85)">▶ Play audio</button><br><br>${r.q.map((x,i)=>`<div>${i+1}. ${x.q}<br><details><summary>Show answer</summary>${x.a}</details></div><br>`).join('')}<details><summary>Show script</summary>${r.s}</details></div>`;say(r.s,.85)},b)}
V.wri=()=>{T('Writing');A(`<p class="sub">Write your IELTS essay. The AI finds mistakes and gives a band estimate.</p><textarea id="wt" placeholder="Write here"></textarea><button class="btn y" onclick="wriGo(this)">Check my writing</button><div id="wx"></div>`)};
async function wriGo(b){const t=$('#wt').value.trim();if(!t)return toast('Write something first');await safe(async()=>{$('#wx').innerHTML=`<div class="box">${(await ask('You are an IELTS writing examiner. For this text give: estimated band, main mistakes with corrections, a improved version, and tips in simple Bangla. Plain text.\n\n'+t)).replace(/\n/g,'<br>')}</div>`},b)}
function tg(){const p=$('#cp');if(p.classList.toggle('o')&&!p.innerHTML)p.innerHTML=`<div class="ch"><span>AI helper</span><button onclick="tg()" aria-label="Close">✕</button></div>`+chatUI('help','You are an English tutor helper for a Bangla-speaking learner. Answer any question briefly in simple English, and in Bangla if the learner writes Bangla. You can read images, PDFs and files they send.');if(p.classList.contains('o')&&CH.help&&!CH.help.d.length){CH.help.d.push({r:'a',t:'Hi! Ask me anything about English. You can send a picture, PDF, file or voice.'});up('help')}}
render();
</script></body></html>
